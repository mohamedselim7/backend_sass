; Set ROLE-specific process counts with env vars; in a scaled setup run web and
; worker containers separately (same image, override command).
[supervisord]
nodaemon=true

[program:php-fpm]
command=php-fpm -F
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true

; Paid/priority lanes are listed first so they drain first.
[program:worker-ai]
command=php /var/www/html/artisan queue:work --queue=ai-high,ai-default,ai-low --sleep=1 --tries=3 --timeout=320 --max-time=3600
numprocs=%(ENV_AI_WORKERS)s
process_name=%(program_name)s_%(process_num)02d
autorestart=true
user=www-data
stopwaitsecs=330

[program:worker-default]
command=php /var/www/html/artisan queue:work --queue=notifications,default --sleep=1 --tries=3 --timeout=90 --max-time=3600
numprocs=%(ENV_DEFAULT_WORKERS)s
process_name=%(program_name)s_%(process_num)02d
autorestart=true
user=www-data

[program:scheduler]
command=php /var/www/html/artisan schedule:work
autorestart=true
user=www-data
